spring.application.name=BlogApp
server.port=9090

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/blog_app_apis
spring.datasource.username=root
spring.datasource.password=Dfipp14061996@
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
# options: none, update, create, create-drop
spring.jpa.hibernate.ddl-auto=update  
# Shows SQL queries in the console (optional)
spring.jpa.show-sql=true  
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true

# Connection Pooling Configuration (Optional, for performance)
 # Max pool size
spring.datasource.hikari.maximum-pool-size=10 
# Min idle connections
spring.datasource.hikari.minimum-idle=5 
# Timeout for idle connections 
spring.datasource.hikari.idle-timeout=30000  

# Enable SQL logging (optional)
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Enable JPA repositories (Spring Data JPA)
spring.data.jpa.repositories.enabled=true

# file related all configuratuon
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

project.image=image/

logging.level.org.springframework.security=DEBUG

